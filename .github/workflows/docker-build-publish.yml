name: Doksmith Reusable Docker Build & Publish

on:
  workflow_call:
    inputs:
      target_versions:
        description: 'JSON array string of versions to build, e.g. ["1.8", "2.0"]'
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(inputs.target_versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse Metadata & Generate Tags
        id: meta
        run: |
          CONFIG="${{ matrix.version }}/build.json"
          NAME=$(jq -r '.name' "$CONFIG")
          TAGS=$(jq -r '.tags[]' "$CONFIG" | sed "s|^|ghcr.io/${{ github.repository_owner }}/$NAME:|")
          PLATFORMS=$(jq -r '.platforms | join(",")' "$CONFIG")
          
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}
          file: ${{ matrix.version }}/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.version }}
          file: ${{ matrix.version }}/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
